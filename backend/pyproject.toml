[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind AI Document Intelligence Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
    "python-multipart>=0.0.9",

    # Validation and settings
    "pydantic[email]>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",

    # Database
    "sqlalchemy>=2.0.30,<3",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",  # used in tests
    "alembic>=1.13.0,<2",

    # Auth
    "python-jose[cryptography]>=3.3.0,<4",
    # passlib 1.7.x is incompatible with bcrypt>=5.0.0
    "passlib[bcrypt]>=1.7.4,<2",
    "bcrypt>=4.0.0,<5",

    # HTTP client (for LLM providers)
    "httpx>=0.27.0",

    # Document processing
    "pymupdf>=1.24.0,<2",
    "python-docx>=1.1.0,<2",

    # AI / RAG (Phase 02)
    "chromadb>=0.5.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "anyio>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
]
ignore = [
    "S101",    # Use of assert — allowed in tests
    "B008",    # Do not perform function calls in default args (FastAPI pattern)
    "UP017",   # Use datetime.UTC alias (not available in Python 3.10)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"alembic/**" = ["ANN", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
